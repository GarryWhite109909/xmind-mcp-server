[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmind-mcp-server"
version = "0.5.0"
description = "让大模型读写 XMind 文件：图片直接交给多模态模型，无 OCR 依赖"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GarryWhite109909", email = "3284263390@qq.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "Pillow>=10.0.0",
    # 用 mathtext 把 Markdown 里的 LaTeX 公式渲染成图片，并绘制预览图
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0",
]
# 旧版用户可能还在用 pip install "xmind-mcp-server[all]"；
# OCR 已移除，这里只保留开发依赖，避免安装直接失败。
all = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0",
]

[project.scripts]
xmind-mcp = "xmind_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/GarryWhite109909/xmind-mcp-server"
Repository = "https://github.com/GarryWhite109909/xmind-mcp-server"
Issues = "https://github.com/GarryWhite109909/xmind-mcp-server/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xmind_mcp = ["default_theme.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# E4/E7/E9 + F 是 ruff 默认规则；B（bugbear）抓常见逻辑坑
select = ["E4", "E7", "E9", "F", "B"]
